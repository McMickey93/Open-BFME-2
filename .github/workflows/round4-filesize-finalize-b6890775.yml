name: Finalize verified BFME2 cleanup handoff

on:
  create:

permissions:
  contents: read

concurrency:
  group: bfme2-round4-filesize-finalize-b6890775
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: 'true'
  GIT_CONFIG_KEY_2: submodule.recurse
  GIT_CONFIG_VALUE_2: 'false'
  PY_PYTHON: '3.12'
  PY_PYTHON3: '3.12'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  BFME_CLAIM_NS: 'refs/heads/claims/'
  BFME_CLAIM_OWNER: 'github:McMickey93:bfme2:round4-20261028'
  BFME_MODEL: OpenAI-Codex
  GIT_TERMINAL_PROMPT: '0'
  GIT_EDITOR: 'true'
  BUILD_POOL: '8'

jobs:
  finalize:
    if: >-
      github.repository == 'McMickey93/Open-BFME-2' &&
      github.event.repository.fork == true &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/codex/20261028-round4-filesize-finalize-b6890775-control' &&
      github.event.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Read finalization controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/qualification/round4-filesize-finalize-b6890775
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read current official project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-2
          ref: master
          path: source
          persist-credentials: false
          fetch-depth: 512
          submodules: false
      - name: Finish progress reporting and prepare regular claim release
        working-directory: source
        env:
          BFME_FINAL_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python -m py_compile ../control/.github/qualification/round4-filesize-finalize-b6890775/finish.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u ../control/.github/qualification/round4-filesize-finalize-b6890775/finish.py
          exit $LASTEXITCODE
      - name: Preserve final progress and release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: session-final-${{ github.run_id }}
          path: session-final-evidence/
          if-no-files-found: warn
          retention-days: 14
