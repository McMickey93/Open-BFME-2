name: Codex BFME2 native decal verification
on:
  push:
    branches: [codex/20261025-bfme2-native]
    paths: [.github/workflows/codex-bfme2-native.yml]
permissions:
  contents: read
concurrency:
  group: codex-bfme2-native-selection
  cancel-in-progress: true
jobs:
  select:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BFME_CLAIM_OWNER: mcmickey93-20261025-bfme2
      BFME_CLAIM_NS: refs/heads/claims/
      PYTHONUTF8: '1'
      BUILD_POOL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Open-BFME/Open-BFME-2
          ref: 0c7ebc35a7181c613f902932d73395abdbad9f66
          fetch-depth: 512
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize compiler reference without recursion
        shell: pwsh
        run: |
          git submodule update --init --depth 1 reference/open-bfme-1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git fetch --no-tags --depth 1 origin refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r reference/open-bfme-1/tools/requirements.txt
          exit $LASTEXITCODE
      - name: Ledger integrity
        run: python tools/check_csv.py
      - name: Fenced native source verification and local commit only
        shell: python
        run: |
          import copy, csv, hashlib, json, os, struct, subprocess, sys, traceback
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build, claims, link_check, link_census
          
          reports = Path('build/codex-selection')
          reports.mkdir(parents=True, exist_ok=True)
          source = Path('Code/Libraries/Source/WWVegas/WW3D2/decalmsh.cpp')
          obstacles = Path('docs/linking_obstacles.md')
          original = source.read_bytes()
          original_obstacles = obstacles.read_bytes()
          source_key = claims.key_of('file:' + source.as_posix())
          claim_sha = '49739d89e66d7bcf017adf69b4a6575975074512'
          success = False
          
          def run(label, command, accepted=(0,), timeout=1200):
              result = subprocess.run(command, capture_output=True, text=True, timeout=timeout)
              output = result.stdout + result.stderr
              (reports / (label + '.txt')).write_text(output, encoding='utf-8')
              print('REPORT ' + label + '\n' + output + '\nRETURN ' + str(result.returncode), flush=True)
              if result.returncode not in accepted:
                  raise RuntimeError(label + ' failed')
              return result
          
          def fence():
              active = claims.active()
              assert active.get(source_key, {}).get('owner') == os.environ['BFME_CLAIM_OWNER'], active.get(source_key)
              assert active[source_key].get('lease') == '54e21b7d72c548d7b65b8f81b40999ce'
              assert claims.holds(source_key, claim_sha), 'claim token changed'
              conflicts = claims.conflicts([source_key])
              assert not conflicts, conflicts
              print('FENCE_OK ' + source_key + ' ' + claim_sha, flush=True)
          
          try:
              fence()
              run('unmatched-before', [sys.executable, 'tools/find_declared_unmatched.py', source.as_posix()])
              run('index', [sys.executable, 'tools/link_check.py', '--fetch-index'])
              run('before-bytes', [sys.executable, 'tools/build.py', source.as_posix()])
              before = run('before-link', [sys.executable, 'tools/link_check.py', source.as_posix()], accepted=(0,1))
              saved_before = reports / 'before-object' / build.obj_path(source).name
              saved_before.parent.mkdir(parents=True, exist_ok=True)
              saved_before.write_bytes(build.obj_path(source).read_bytes())
              rows = [row for row in csv.DictReader(Path('reverse/functions.csv').open(newline='')) if row['source'] == source.as_posix()]
              assert len(rows) == 6 and all(row['status']=='matched' for row in rows), rows
              data_rows = [row for row in csv.DictReader(Path('reverse/data_rows.csv').open(newline='')) if row.get('source') == source.as_posix()]
              assert not data_rows, data_rows
              registry = Path('reverse/canonical_classes.csv').read_text()
              assert 'RigidDecalMeshClass' not in registry, 'registered canonical class; a private view is forbidden'
              getter = build.read_target_bytes(0x005508E9, 7)
              assert getter[:2] == bytes.fromhex('8b81') and getter[-1:] == bytes.fromhex('c3'), getter.hex()
              offset = struct.unpack_from('<I', getter, 2)[0]
              assert 4 < offset < 4096 and offset % 4 == 0, offset
              print('GETTER_PROOF ' + getter.hex() + ' offset=' + hex(offset), flush=True)
              header = original.decode('utf-8').splitlines()[0]
              candidate = header + '\n// stlport\n'
              candidate += '// Keep the five native Texture-pointer vector members owned by this TU.\n'
              candidate += '// Unmatched Zero Hour decal renderers are omitted: their native BFME 2 implementations are not established here.\n'
              candidate += 'void __cdecl operator delete[](void *) throw();\nvoid __cdecl operator delete(void *) throw();\n'
              candidate += 'class TextureClass;\n#include "simplevec.h"\n\n'
              candidate += 'template SimpleVecClass<TextureClass *>::SimpleVecClass(int);\n'
              candidate += 'template bool SimpleVecClass<TextureClass *>::Resize(int);\n'
              candidate += 'template bool SimpleVecClass<TextureClass *>::Uninitialised_Grow(int);\n'
              candidate += 'template SimpleDynVecClass<TextureClass *>::SimpleDynVecClass(int);\n'
              candidate += 'template bool SimpleDynVecClass<TextureClass *>::Resize(int);\n\n'
              candidate += '// Narrow existing receiver view: only the retail count field is modeled.\n'
              candidate += '// The original donor accessor is Decals.Count(); other fields and slots are not asserted.\n'
              candidate += 'class RigidDecalMeshClass\n{\npublic:\n    virtual int Decal_Count();\nprivate:\n'
              candidate += f'    unsigned char m_04[0x{offset-4:X}];\n    int m_{offset:X};\n'
              candidate += '};\n\nint RigidDecalMeshClass::Decal_Count()\n{\n'
              candidate += f'    return m_{offset:X};\n'
              candidate += '}\n'
              (reports / 'candidate.cpp').write_text(candidate, encoding='utf-8')
              fence()
              source.write_bytes(candidate.encode('utf-8'))
              run('unmatched-after', [sys.executable, 'tools/find_declared_unmatched.py', source.as_posix()])
              run('after-bytes', [sys.executable, 'tools/build.py', source.as_posix()])
              symbols = build.read_object_symbols(build.obj_path(source).read_bytes())
              rigid = [entry for entry in symbols if entry['section'] > 0 and 'RigidDecalMeshClass' in entry['name']]
              print('RIGID_DEFINED ' + json.dumps(rigid), flush=True)
              assert not any('??_7RigidDecalMeshClass' in entry['name'] for entry in rigid), 'partial-view vtable must not be emitted'
              after = run('after-link', [sys.executable, 'tools/link_check.py', source.as_posix()])
              assert ': LINKS' in after.stdout and '326' in after.stdout, after.stdout
              truth = link_census.RetailTruth(link_census.ledger())
              old_index = link_check.load_index()
              link_check.refresh(old_index, [saved_before], truth)
              new_index = copy.deepcopy(old_index)
              new_object = build.obj_path(source)
              link_check.refresh(new_index, [new_object], truth)
              old_facts = link_census.object_facts(saved_before, truth)
              new_facts = link_census.object_facts(new_object, truth)
              def definitions(facts, obj):
                  return set(facts[1]) | {entry[0] for entry in facts[0]} | set(link_census.common_definitions(obj))
              old_names = definitions(old_facts, saved_before)
              new_names = definitions(new_facts, new_object)
              removed = sorted(old_names - new_names)
              known = set(build.load_symbol_map()) | set(old_index['selection']['owners'])
              def providers(index, name):
                  found = [(position, 'strong', None, None) for position in index['strong'].get(name,())]
                  found += [(position, 'comdat', digest, verdict) for position,digest,verdict in index['comdat'].get(name,())]
                  found += [(position, 'common', size, None) for position,size in index['common'].get(name,())]
                  return sorted(found)
              def selected(index, name):
                  found = providers(index, name)
                  if not found: return None
                  holder = index['selection']['exceptions'].get(name, found[0][0])
                  if holder is None: return {'holder':None, 'kind':'unknown', 'digest':None, 'retail':None}
                  selected = next((entry for entry in found if entry[0]==holder), found[0])
                  return {'holder':index['objects'][selected[0]], 'kind':selected[1], 'digest':selected[2], 'retail':selected[3]}
              audit = []
              losses = []
              for name in removed:
                  old_selected, new_selected = selected(old_index,name), selected(new_index,name)
                  entry = {'name':name,'mapped':name in known,'referenced':link_check.is_referenced(old_index,name),
                           'old_selected':old_selected,'new_selected':new_selected,
                           'remaining_providers':[(new_index['objects'][p],k,d,v) for p,k,d,v in providers(new_index,name)]}
                  audit.append(entry)
                  if name in known:
                      if new_selected is None:
                          losses.append(name + ': mapped sole provider disappears')
                      elif old_selected and old_selected['holder'] == saved_before.name:
                          identical = old_selected['kind']=='comdat' and new_selected['kind']=='comdat' and old_selected['digest']==new_selected['digest']
                          if not identical and new_selected['retail'] is not True:
                              losses.append(name + ': mapped selected provider not proven equivalent')
              removed_aliases = sorted(set(link_check.alternate_names(saved_before)) - set(link_check.alternate_names(new_object)))
              report = {'removed_count':len(removed),'removed_aliases':removed_aliases,'mapped_losses':losses,'entries':audit}
              (reports / 'provider-audit.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
              print('PROVIDER_AUDIT ' + json.dumps(report),flush=True)
              assert not removed_aliases, removed_aliases
              assert not losses, losses
              run('new-variants', [sys.executable,'tools/link_check.py','--new-variants',source.as_posix()])
              addition = """
          - **Decal unmatched-emission subset (2026-10-25):**
            The native check of `decalmsh.cpp` retains all six existing exact rows
            (326 bytes) while removing 18 explicitly unmatched Zero Hour function
            definitions. Five Texture-pointer vector members are emitted explicitly;
            the existing count getter keeps its directly proven receiver-field load,
            with no new vtable definition. The six unresolved legacy renderer calls
            disappear. Normal byte verification passes 6/6 before and after.
            Against the fixed `ef9c691284` index (2026-10-25 18:23), the bounded ordinary
            preview changes this unit from blocked to clean (0 -> 326 authored bytes).
            No new C++ exact bytes, census headline or closed-strict result is claimed.
            Verification is the isolated native fork workflow; canonical class
            registration, data ownership, source claims and the actual file lease are
            checked before editing. The broader compiler/provider entry remains open.
          """
              old_blob = subprocess.check_output(['git','rev-parse','HEAD:' + source.as_posix()],text=True).strip()
              new_blob = subprocess.check_output(['git','hash-object','--path=' + source.as_posix(),source.as_posix()],text=True).strip()
              addition += '\n  Source blobs: original `' + old_blob + '`, repaired `' + new_blob + '`.\n'
              addition += '  Existing rows retained without ledger edits:\n\n  | RVA | Bytes | Symbol |\n  | --- | ---: | --- |\n'
              for row in rows:
                  addition += '  | `' + row['target_rva'] + '` | ' + row['target_size'] + ' | `' + row['name'] + '` |\n'
              addition += '\n  Provider audit retains every mapped symbol through an equivalent or retail-correct provider; no linker alias is removed.\n'
              addition += '  Native receipt: https://github.com/McMickey93/Open-BFME-2/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '.\n'
              old_text = subprocess.check_output(['git','show','HEAD:' + obstacles.as_posix()]).decode('utf-8')
              newline = '\r\n' if '\r\n' in old_text else '\n'
              addition = addition.replace('\r\n', '\n').replace('\n', newline)
              marker = newline + '### LINK-007:'
              assert marker in old_text and 'Decal unmatched-emission subset' not in old_text
              obstacles.write_bytes(old_text.replace(marker, addition + marker, 1).encode('utf-8'))
              run('diff-check', ['git','diff','--check'])
              run('setup-hooks', ['bash','tools/setup_hooks.sh'])
              run('git-author', ['git','config','user.name','McMickey93'])
              run('git-email', ['git','config','user.email','347452154+McMickey93@users.noreply.github.com'])
              run('stage', ['git','add',source.as_posix(),obstacles.as_posix()])
              fence()
              message = 'Remove unmatched decal renderers while retaining all native helper bodies\n\nExplicitly emit the five Texture-pointer vector members and keep the existing count accessor. This removes six legacy-only unresolved dependencies while preserving all six byte-exact rows (326 bytes).\n\nValidation: normal native byte gates 6/6 before and after; bounded fixed-index link preview blocked -> clean. No new C++ exact or census coverage claimed.'
              run('normal-commit', ['git','-c','core.hooksPath=.githooks','commit','-m',message], timeout=1800)
              run('progress', [sys.executable,'tools/progress.py','origin/master'])
              run('review-diff', ['git','show','--stat','--oneline','HEAD'])
              files = {path.as_posix():subprocess.check_output(['git','show','HEAD:' + path.as_posix()]).decode('utf-8') for path in [source, obstacles]}
              export = {'base':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
                        'native_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                        'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                        'message':message, 'files':files,
                        'sha256':{path:hashlib.sha256(value.encode()).hexdigest() for path,value in files.items()},
                        'getter_offset':offset,'getter_bytes':getter.hex(),'claim':claim_sha}
              (reports / 'export.json').write_text(json.dumps(export,indent=2),encoding='utf-8')
              print('EXPORT ' + json.dumps(export), flush=True)
              success = True
          except BaseException:
              traceback.print_exc()
              raise
          finally:
              if not success:
                  subprocess.run(['git','restore','--staged','--',source.as_posix(),obstacles.as_posix()],capture_output=True)
                  source.write_bytes(original)
                  obstacles.write_bytes(original_obstacles)
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfme2-native-selection
          path: build/codex-selection/
          if-no-files-found: error
