name: Codex BFME2 native decal verification
on:
  push:
    branches: [codex/20261025-bfme2-native]
    paths: [.github/workflows/codex-bfme2-native.yml]
permissions:
  contents: read
concurrency:
  group: codex-bfme2-native-selection
  cancel-in-progress: true
jobs:
  select:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BFME_CLAIM_OWNER: mcmickey93-20261025-bfme2
      BFME_CLAIM_NS: refs/heads/claims/
      PYTHONUTF8: '1'
      BUILD_POOL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: McMickey93/Open-BFME-2
          ref: d52a8806cd920cf8a6b3cde70cf253722c0fa823
          fetch-depth: 1024
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize compiler reference without recursion
        shell: pwsh
        run: |
          git remote set-url origin https://github.com/Open-BFME/Open-BFME-2.git
          git submodule update --init --depth 1 reference/open-bfme-1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git fetch --no-tags --depth 1024 origin refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r reference/open-bfme-1/tools/requirements.txt
          exit $LASTEXITCODE
      - name: Ledger integrity
        run: python tools/check_csv.py
      - name: Resolve the native Git Bash executable
        shell: bash
        run: |
          git_bash="$BASH"
          [[ "${git_bash,,}" == *.exe ]] || git_bash="${git_bash}.exe"
          printf 'BFME_NATIVE_BASH=%s\n' "$(cygpath -aw "$git_bash")" >> "$GITHUB_ENV"
      - name: Qualify the actual API commit with normal native hooks
        shell: python
        run: |
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build, claims
          git_bash = Path(os.environ['BFME_NATIVE_BASH'])
          assert git_bash.is_file(), git_bash
          os.environ['PATH'] = str(git_bash.parent) + os.pathsep + os.environ.get('PATH','')
          reports = Path('build/codex-selection')
          reports.mkdir(parents=True, exist_ok=True)
          actual = 'd52a8806cd920cf8a6b3cde70cf253722c0fa823'
          base = '1cd28a3a8832d6e53c4aa4716a5771c0f7dd0349'
          expected_tree = '717a75fb8139b8589756bad76097ddb09972e8c6'
          expected_files = {"Code/Libraries/Source/WWVegas/WW3D2/decalmsh.cpp":"566f20b61e0aa1593650bacd030d559c61d36919f153fba68b6d72fe165d58dd","docs/linking_obstacles.md":"af1322b08dbbb0383bcdf94318205c56495d69dc67411f01298e68df0816a73b"}
          source = 'Code/Libraries/Source/WWVegas/WW3D2/decalmsh.cpp'
          claim_sha = '49739d89e66d7bcf017adf69b4a6575975074512'
          key = claims.key_of('file:' + source)
          def run(label, command, stdin=None, timeout=1200):
              result = subprocess.run(command, input=stdin, capture_output=True, text=True, timeout=timeout)
              output = result.stdout + result.stderr
              (reports / (label + '.txt')).write_text(output, encoding='utf-8')
              print('REPORT ' + label + '\n' + output + '\nRETURN ' + str(result.returncode), flush=True)
              result.check_returncode()
              return result
          def git(*argv):
              return subprocess.check_output(['git',*argv])
          def fence():
              active = claims.active()
              assert active.get(key,{}).get('owner') == os.environ['BFME_CLAIM_OWNER']
              assert active[key].get('lease') == '54e21b7d72c548d7b65b8f81b40999ce'
              assert claims.holds(key, claim_sha)
              assert not claims.conflicts([key])
              print('FENCE_OK ' + key + ' ' + claim_sha, flush=True)
          assert git('rev-parse','HEAD').decode().strip() == actual
          raw = git('cat-file','commit',actual)
          headers, message = raw.split(b'\n\n',1)
          header_lines = headers.split(b'\n')
          assert not any(line.startswith(b'gpgsig ') for line in header_lines), 'signed commit requires explicit unchanged hook route'
          fields = {}
          for line in header_lines:
              tag, value = line.split(b' ',1)
              fields.setdefault(tag,[]).append(value)
          assert set(fields) == {b'tree',b'parent',b'author',b'committer'}, set(fields)
          assert fields[b'tree'] == [expected_tree.encode()]
          assert fields[b'parent'] == [base.encode()]
          assert message.decode('utf-8').rstrip('\n') == "Remove unmatched decal renderers while retaining all native helper bodies\n\nExplicitly emit the five Texture-pointer vector members and keep the existing count accessor. This removes six legacy-only unresolved dependencies while preserving all six byte-exact rows (326 bytes).\n\nValidation: normal native byte gates 6/6 before and after; bounded fixed-index link preview blocked -> clean. No new C++ exact or census coverage claimed."
          assert git('diff','--name-only',base,actual).decode().splitlines() == sorted(expected_files)
          for path, expected in expected_files.items():
              blob = git('show',actual + ':' + path)
              assert hashlib.sha256(blob).hexdigest() == expected, path
          before_header = git('show',base + ':' + source).splitlines()[0]
          assert git('show',actual + ':' + source).splitlines()[0] == before_header
          assert b'Copyright 2025 Electronic Arts Inc.' in git('show',actual + ':' + source)
          fence()
          run('setup-hooks',[str(git_bash),'tools/setup_hooks.sh'])
          run('index',[sys.executable,'tools/link_check.py','--fetch-index'])
          for field, prefix in ((b'author','GIT_AUTHOR'),(b'committer','GIT_COMMITTER')):
              ident = re.fullmatch(rb'(.*) <([^>]*)> ([0-9]+) ([+-][0-9]{4})',fields[field][0])
              assert ident, 'unparseable Git identity'
              name, email, epoch, zone = ident.groups()
              os.environ[prefix + '_NAME'] = name.decode('utf-8')
              os.environ[prefix + '_EMAIL'] = email.decode('utf-8')
              os.environ[prefix + '_DATE'] = '@' + epoch.decode() + ' ' + zone.decode()
          message_path = reports / 'exact-api-message.txt'
          message_path.write_bytes(message)
          run('stage-exact-api-tree',['git','reset','--soft',base])
          fence()
          run('normal-recreate-api-commit',['git','-c','core.hooksPath=.githooks','commit','--cleanup=verbatim','--file',str(message_path)],timeout=1800)
          assert git('rev-parse','HEAD').decode().strip() == actual, 'normal gated Git commit must reproduce exact API identity'
          assert git('cat-file','commit','HEAD') == raw
          assert git('diff','--name-only').strip() == b'', 'worktree changed during hooks'
          run('byte-verification',[sys.executable,'tools/build.py',source])
          symbols = build.read_object_symbols(build.obj_path(Path(source)).read_bytes())
          rigid = [item for item in symbols if item['section'] > 0 and 'RigidDecalMeshClass' in item['name']]
          assert not any('??_7RigidDecalMeshClass' in item['name'] for item in rigid)
          run('bounded-link-preview',[sys.executable,'tools/link_check.py',source])
          run('new-variants',[sys.executable,'tools/link_check.py','--new-variants',source])
          fence()
          push_line = 'HEAD ' + actual + ' refs/heads/codex/20261025-bfme2-decal-native-cleanup ' + '0'*40 + '\n'
          run('normal-pre-push',[str(git_bash),'.githooks/pre-push','origin','https://github.com/McMickey93/Open-BFME-2.git'],stdin=push_line,timeout=2400)
          assert git('rev-parse','HEAD').decode().strip() == actual
          assert git('diff','--name-only').strip() == b''
          run('progress',[sys.executable,'tools/progress.py','origin/master'])
          receipt = {'actual_sha':actual,'tree':expected_tree,'parent':base,'files':expected_files,
                     'raw_commit_sha256':hashlib.sha256(raw).hexdigest(),'normal_commit_identical':True,
                     'normal_pre_push':True,'claim':claim_sha,'publish_ref':'refs/heads/codex/20261025-bfme2-decal-native-cleanup'}
          (reports / 'qualification.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          print('QUALIFIED ' + json.dumps(receipt),flush=True)
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfme2-native-selection
          path: build/codex-selection/
          if-no-files-found: error
