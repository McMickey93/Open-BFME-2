name: Codex BFME2 native work selection
on:
  push:
    branches: [codex/20261025-bfme2-native]
    paths: [.github/workflows/codex-bfme2-native.yml]
permissions:
  contents: read
concurrency:
  group: codex-bfme2-native-selection
  cancel-in-progress: true
jobs:
  select:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BFME_CLAIM_OWNER: mcmickey93-20261025-bfme2
      PYTHONUTF8: '1'
      BUILD_POOL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Open-BFME/Open-BFME-2
          ref: 349db6dc10069cc230469ebf3f6dd6d19a17fb82
          fetch-depth: 512
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize compiler reference without recursion
        shell: pwsh
        run: |
          git submodule update --init --depth 1 reference/open-bfme-1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git fetch --no-tags --depth 1 origin refs/heads/master:refs/remotes/origin/master
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -r reference/open-bfme-1/tools/requirements.txt
          exit $LASTEXITCODE
      - name: Ledger integrity
        run: python tools/check_csv.py
      - name: Selection and reports (read only)
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          reports = Path('build/codex-selection')
          reports.mkdir(parents=True, exist_ok=True)
          source = 'Code/Libraries/Source/WWVegas/WW3D2/decalmsh.cpp'
          commands = [
            ('head', ['git', 'rev-parse', 'HEAD']),
            ('reference', ['git', 'submodule', 'status', 'reference/open-bfme-1']),
            ('reference-upstream', ['git', 'ls-remote', 'https://github.com/Open-BFME/Open-BFME-1.git', 'refs/heads/master']),
            ('progress', [sys.executable, 'tools/progress.py', 'origin/master']),
            ('unmatched', [sys.executable, 'tools/find_declared_unmatched.py', source]),
            ('census-history', ['git', 'fetch', '--no-tags', '--depth', '1', 'origin', 'ef9c691284a2798f4acce0973f4785d78c7111f4']),
            ('ledger-rows', [sys.executable, '-c', "import csv,json;print(json.dumps([r for r in csv.DictReader(open('reverse/functions.csv',newline='')) if r['source']=='"+source+"'],indent=2))"]),
            ('index', [sys.executable, 'tools/link_check.py', '--fetch-index']),
            ('native-control', [sys.executable, 'tools/build.py', source]),
            ('preview', [sys.executable, 'tools/link_check.py', source]),
            ('ranked-file', [sys.executable, 'tools/link_rank.py', '--file', source]),
            ('link-near', [sys.executable, 'tools/link_rank.py', '--near', '1', '--top', '12']),
            ('naked-all', [sys.executable, 'tools/list_naked_candidates.py', 'Code', '--all', '--ranked', '--limit', '15', '--max-bytes', '100000']),
          ]
          sys.path.insert(0, 'tools')
          import claims
          claim_key = claims.key_of('file:' + source)
          conflict = claims.conflicts([claim_key])
          if conflict:
              print('CLAIM_CONFLICT ' + json.dumps({str(k):v for k,v in conflict.items()}), flush=True)
          else:
              marker_sha = claims._record(claims.owner(), 4,
                  note='Prepared source cleanup; no upstream lease until create-only Connector publication',
                  scope=source, locks=[claim_key])
              record = json.loads(subprocess.check_output(['git','show','-s','--format=%B',marker_sha], text=True))
              empty_tree = subprocess.check_output(['git','show','-s','--format=%T',marker_sha],text=True).strip()
              prepared = {'source':source,'key':claim_key,'record':record,'local_sha':marker_sha,'tree':empty_tree,
                          'base':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
              (reports / 'prepared-claim.json').write_text(json.dumps(prepared, indent=2))
              print('PREPARED_CLAIM ' + json.dumps(prepared), flush=True)
          verdicts = {}
          for label, command in commands:
              print('\nREPORT ' + label, flush=True)
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=1200)
                  text = result.stdout + result.stderr
                  verdicts[label] = result.returncode
              except subprocess.TimeoutExpired as error:
                  text = str(error)
                  verdicts[label] = 'timeout'
              (reports / (label + '.txt')).write_text(text, encoding='utf-8')
              print(text, flush=True)
              print('RETURN ' + str(verdicts[label]), flush=True)
          (reports / 'verdicts.json').write_text(json.dumps(verdicts, indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfme2-native-selection
          path: build/codex-selection/
          if-no-files-found: error
