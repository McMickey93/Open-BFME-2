name: Native bounded BFME2 linking cleanup
on:
  create:
permissions:
  contents: read
concurrency:
  group: round5-bfme2-20261028-native-7
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: 'true'
  GIT_CONFIG_KEY_2: submodule.recurse
  GIT_CONFIG_VALUE_2: 'false'
  PY_PYTHON: '3.12'
  PY_PYTHON3: '3.12'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  BFME_CLAIM_NS: refs/heads/claims/
  BFME_CLAIM_OWNER: 'github:McMickey93:bfme2:round5-20261028'
  BFME_MODEL: OpenAI-Codex
  GIT_TERMINAL_PROMPT: '0'
  GIT_EDITOR: 'true'
  BUILD_POOL: '4'
jobs:
  syntax:
    if: >-
      github.repository == 'McMickey93/Open-BFME-2' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/codex/round5-bfme2-20261028-native-7-control' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/qualification/round5-bfme2-20261028-native-7
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Validate controller syntax
        run: python3 -m py_compile .github/qualification/round5-bfme2-20261028-native-7/native.py
  retire_unclaimed_checkout:
    needs: syntax
    if: >-
      github.repository == 'McMickey93/Open-BFME-2' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/codex/round5-bfme2-20261028-native-7-control' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop only the superseded unclaimed source checkout
        shell: python
        env:
          BFME_CANCEL_TOKEN: ${{ github.token }}
        run: |
          import os, json, time, urllib.request, urllib.error
          assert os.environ['GITHUB_REPOSITORY'] == 'McMickey93/Open-BFME-2'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/round5-bfme2-20261028-native-7-control'
          base = 'https://api.github.com/repos/McMickey93/Open-BFME-2/actions/runs/40760121489'
          def request(suffix='', method='GET'):
              req = urllib.request.Request(base + suffix,
                  data=b'{}' if method == 'POST' else None,
                  headers={'Authorization': 'Bearer ' + os.environ['BFME_CANCEL_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method=method)
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response) if response.status != 202 else {}
          old = request()
          assert old['head_sha'] == '7dd1a00a8a652b2280c4dc0900e66d225fc3adcf'
          assert old['head_branch'] == 'codex/round5-bfme2-20261028-native-6-control'
          if old['status'] != 'completed':
              try:
                  request('/cancel', 'POST')
              except urllib.error.HTTPError as error:
                  assert error.code == 409
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline and request()['status'] != 'completed':
                  time.sleep(5)
          assert request()['status'] == 'completed', 'No overlapping source workers'
          print('Exact superseded unclaimed checkout stopped; no source or official ref changed.')
  qualify:
    needs: [syntax, retire_unclaimed_checkout]
    if: >-
      github.repository == 'McMickey93/Open-BFME-2' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/codex/round5-bfme2-20261028-native-7-control' && github.event.ref_type == 'branch'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - name: Read immutable controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: McMickey93/Open-BFME-2
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/qualification/round5-bfme2-20261028-native-7
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read pinned official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-2
          ref: 696149099cdd2684fb438e6c4da1b35ebeca67c0
          path: source
          persist-credentials: false
          fetch-depth: 1024
          submodules: false
      - name: Native qualification and ordinary hooks
        shell: bash
        working-directory: source
        env:
          BFME_TRANSFER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_bash="$BASH"
          [[ "${git_bash,,}" == *.exe ]] || git_bash="${git_bash}.exe"
          export BFME_QUALIFICATION_BASH="$(cygpath -aw "$git_bash")"
          python -u ../control/.github/qualification/round5-bfme2-20261028-native-7/native.py
      - name: Preserve complete native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: round5-bfme2-20261028-native-7-${{ github.run_id }}
          path: round5-evidence/
          if-no-files-found: warn
          retention-days: 14
